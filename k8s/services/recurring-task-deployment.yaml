apiVersion: apps/v1
kind: Deployment
metadata:
  name: recurring-task
  labels:
    app: recurring-task
    service: recurring-task
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recurring-task
  template:
    metadata:
      labels:
        app: recurring-task
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "recurring-task"
        dapr.io/app-port: "8002"
        dapr.io/log-level: "info"
        dapr.io/enable-profiling: "false"
    spec:
      containers:
      - name: recurring-task
        image: todo-chatbot/recurring-task:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
          name: http
        env:
        - name: APP_PORT
          value: "8002"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_GRPC_PORT
          value: "50001"
        - name: ENVIRONMENT
          value: "local"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
