apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: default
  labels:
    app: chat-api
spec:
  type: ClusterIP
  selector:
    app: chat-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: dapr-http
    port: 3500
    targetPort: 3500
    protocol: TCP
  - name: dapr-grpc
    port: 50001
    targetPort: 50001
    protocol: TCP
