apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-log
  labels:
    app: audit-log
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-log
  template:
    metadata:
      labels:
        app: audit-log
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "audit-log"
        dapr.io/app-port: "8005"
        dapr.io/log-level: "info"
    spec:
      containers:
      - name: audit-log
        image: todo-chatbot/audit-log:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8005
          name: http
        env:
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_GRPC_PORT
          value: "50001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8005
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
