apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: azurekeyvault
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
  - name: vaultName
    value: "todo-chatbot-kv"
  - name: azureTenantId
    value: "YOUR_TENANT_ID"
  - name: azureClientId
    value: "YOUR_CLIENT_ID"
  - name: azureClientSecret
    secretKeyRef:
      name: azure-credentials
      key: clientSecret
auth:
  secretStore: kubernetes
