apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: audit-log-subscriptions
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-events
  routes:
    default: /events/task
  scopes:
  - audit-log
  bulkSubscribe:
    enabled: true
    maxMessagesCount: 500
    maxAwaitDurationMs: 2000
