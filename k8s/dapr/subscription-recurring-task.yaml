apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: recurring-task-subscriptions
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-events
  routes:
    default: /events/task
  scopes:
  - recurring-task
  bulkSubscribe:
    enabled: true
    maxMessagesCount: 100
    maxAwaitDurationMs: 1000
