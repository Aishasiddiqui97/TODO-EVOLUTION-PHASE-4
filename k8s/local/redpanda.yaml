apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: vectorized/redpanda:latest
        command:
        - redpanda
        - start
        - --smp
        - "1"
        - --overprovisioned
        - --kafka-addr
        - PLAINTEXT://0.0.0.0:9092
        - --advertise-kafka-addr
        - PLAINTEXT://redpanda:9092
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9644
          name: admin
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: default
spec:
  selector:
    app: redpanda
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 9644
    targetPort: 9644
    name: admin
  type: ClusterIP
