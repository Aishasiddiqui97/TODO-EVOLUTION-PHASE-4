# Default values for todo-chatbot
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

backend:
  name: backend
  replicas: 3
  image:
    repository: todo-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  healthCheck:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  env:
    - name: DATABASE_URL
      value: "postgresql://postgres:postgres@host.minikube.internal:5432/todo_db"
    - name: ENVIRONMENT
      value: "production"
    - name: OPENAI_API_KEY
      value: "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"
    - name: OPENAI_BASE_URL
      value: "https://openrouter.ai/api/v1"
    - name: OPENAI_MODEL
      value: "google/gemini-2.0-flash-001"
    - name: SECRET_KEY
      value: "development_secret_key"
    - name: ALGORITHM
      value: "HS256"
    - name: ALLOWED_ORIGINS
      value: "*"

frontend:
  name: frontend
  replicas: 1
  image:
    repository: todo-frontend
    tag: v1.0.1
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  healthCheck:
    path: /
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
